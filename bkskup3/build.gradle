apply plugin: 'com.android.application'

buildscript
        {
            repositories {
                google()
                mavenCentral()

                maven {
                    url 'https://maven.fabric.io/public'
                }
            }
            dependencies {
                classpath 'com.google.gms:google-services:4.4.4'
//                classpath 'io.fabric.tools:gradle:1.28.0'
            }


        }

repositories {
    mavenCentral()
    maven {
        url "https://dl.bintray.com/kotlin/kotlin-dev/"
    }
    maven {
        url "https://maven.google.com" // Google's Maven repository
    }

    maven {
        url "https://repo.cuba-platform.com/content/groups/work/"
    }

    google()
}

android {
    compileSdkVersion 35

    defaultConfig {
        applicationId "com.bk.bkskup3"
        minSdkVersion 33
        targetSdkVersion 35
        versionCode 40
        versionName "4.0"
        multiDexEnabled true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/NOTICE', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE.txt']
        }
    }

    namespace 'com.bk.bkskup3'
    lint {
        abortOnError false
    }


}



dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation project(':barcodeservice')
    implementation project(':printservice')
    implementation project(':countries')
    implementation project(':bksettings')
    implementation project(':bkwidgets')
    implementation project(':bluetoothcommon')
    implementation project(':bkbands')
    implementation 'com.android.support:support-v4:28.0.0'
    implementation 'com.google.firebase:firebase-database:22.0.1'
    implementation 'com.android.support:appcompat-v7:28.0.0'
    implementation 'com.android.support:recyclerview-v7:28.0.0'
    implementation 'com.android.support:design:28.0.0'
    implementation 'com.google.firebase:firebase-crash:16.2.1'
    implementation 'com.facebook.stetho:stetho:1.6.0'
    implementation 'com.google.firebase:firebase-core:21.1.1'
    implementation 'com.facebook.stetho:stetho-okhttp:1.6.0'
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'
    implementation 'io.reactivex.rxjava2:rxjava:2.2.21'
    implementation 'com.google.guava:guava:33.6.0-android'
    annotationProcessor 'com.squareup.dagger:dagger-compiler:1.2.5'
    implementation 'com.squareup.dagger:dagger:1.2.5'
    implementation 'com.squareup.okhttp3:logging-interceptor:5.3.2'
    compileOnly 'org.glassfish:javax.annotation:10.0-b28'
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-jackson:3.0.0'
    implementation 'com.firebase:firebase-jobdispatcher:0.8.5'
    implementation 'com.android.support:exifinterface:28.0.0'
//    implementation 'com.google.android.gms:play-services-vision:20.1.3'
//    implementation 'com.google.firebase:firebase-ml-vision:24.1.0'
//    implementation 'com.crashlytics.sdk.android:crashlytics:2.10.1'
}

apply plugin: 'com.google.gms.google-services'
